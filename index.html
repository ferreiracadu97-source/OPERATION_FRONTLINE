
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101813">
<title>OPERATION FRONTLINE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101813;color:white;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;top:10px;left:12px;background:#101813cc;border:1px solid #71816c;padding:9px 12px;border-radius:7px;font-size:12px;line-height:1.6}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:25px;color:#e5eee0;text-shadow:0 0 5px black}
#ammo{position:absolute;right:14px;bottom:120px;background:#101813dd;padding:10px 14px;border-radius:7px;text-align:right;font-size:12px}
#ammo strong{font-size:21px}
#controls{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:10px;pointer-events:none}
#stick{width:115px;height:115px;border:2px solid #d1dfbd77;border-radius:50%;background:#263b2c99;position:relative;pointer-events:auto;touch-action:none}
#knob{position:absolute;width:45px;height:45px;left:33px;top:33px;border-radius:50%;background:#b7c9adbb}
.actions{display:flex;gap:8px;align-items:end;pointer-events:auto}
button{color:white;background:#344b39e8;border:1px solid #a7b79a;border-radius:9px;padding:12px 10px;font-weight:bold;font-size:11px}
#fire{width:70px;height:70px;border-radius:50%;background:#85332c}
#aim{width:55px;height:55px;border-radius:50%}
#reload,#heal{min-height:48px}
#hint{position:absolute;bottom:137px;left:50%;transform:translateX(-50%);font-size:10px;color:#dce6d499;white-space:nowrap}
#start,#rotate{position:fixed;inset:0;z-index:10;background:#101813f5;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px}
#start h1{font-size:30px;letter-spacing:3px;margin:0}
#start p{color:#b7c8b1}
#start button{font-size:16px;padding:17px 25px;margin-top:15px}
#rotate{display:none;z-index:20;background:#101813;gap:15px}
#rotate span{font-size:48px}
@media(orientation:portrait){
 #rotate{display:flex}
}
</style>
</head>
<body>

<div id="start">
<h1>OPERATION<br>FRONTLINE</h1>
<p>CAMPO DE TREINAMENTO</p>
<p>PROTÓTIPO 0.2</p>
<button id="begin">INICIAR TREINAMENTO</button>
</div>

<div id="rotate"><span>📱↻</span><b>GIRE O CELULAR</b><small>Jogue com a tela na horizontal</small></div>

<div id="hud">
<div id="top">
<b>OPERATION FRONTLINE</b><br>
<span id="health">VIDA: 100</span><br>
<span id="quality">GRÁFICOS: ALTO</span><br>
CAMPO DE TREINAMENTO
</div>
<div id="crosshair">+</div>
<div id="hint">Arraste o lado direito para olhar</div>
<div id="ammo">
FUZIL DE ASSALTO<br>
<strong id="ammunition">30 / 120</strong>
</div>
<div id="controls">
<div id="stick"><div id="knob"></div></div>
<div class="actions">
<button id="heal">KIT<br>+25</button>
<button id="reload">RECARREGAR</button>
<button id="aim">MIRA</button>
<button id="fire">ATIRAR</button>
</div>
</div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9aadb0);
scene.fog=new THREE.Fog(0x9aadb0,35,110);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,180);
camera.position.set(0,1.7,5);
scene.add(camera);

const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdce9f0,0x303d28,2));
const sun=new THREE.DirectionalLight(0xffe9c5,2.2);
sun.position.set(-25,35,15);
scene.add(sun);

const materials={
ground:new THREE.MeshStandardMaterial({color:0x536447,roughness:1}),
wall:new THREE.MeshStandardMaterial({color:0x77796d,roughness:.95}),
wood:new THREE.MeshStandardMaterial({color:0x69533a,roughness:1}),
green:new THREE.MeshStandardMaterial({color:0x29432a,roughness:1}),
leaf:new THREE.MeshStandardMaterial({color:0x355438,roughness:1}),
trunk:new THREE.MeshStandardMaterial({color:0x59432e}),
red:new THREE.MeshStandardMaterial({color:0x982f26,roughness:.8}),
skin:new THREE.MeshStandardMaterial({color:0xb69a77})
};

function box(x,y,z,sx,sy,sz,mat){
const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
o.position.set(x,y,z);
scene.add(o);
return o;
}

const ground= new THREE.Mesh(new THREE.PlaneGeometry(180,180),materials.ground);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// Terreno e caminhos
const path=box(0,.012,-18,15,.025,85,new THREE.MeshStandardMaterial({color:0x796e53}));
path.rotation.y=.08;

// Construções do treinamento
box(0,2,-30,20,4,1,materials.wall);
box(-10,1,-17,1,2,9,materials.wall);
box(10,1,-17,1,2,9,materials.wall);
box(-7,.65,-8,2.5,1.3,2,materials.wood);
box(7,.65,-8,2.5,1.3,2,materials.wood);
box(-15,1.5,-35,8,3,8,materials.green);
box(15,1.5,-35,8,3,8,materials.green);

// Árvores
function tree(x,z,size=1){
const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.18*size,.28*size,2.5*size,7),
materials.trunk);
trunk.position.set(x,1.25*size,z);
scene.add(trunk);
const crown=new THREE.Mesh(
new THREE.SphereGeometry(1.35*size,8,7),
materials.leaf);
crown.position.set(x,3*size,z);
scene.add(crown);
}
for(let i=0;i<32;i++){
const side=i%2===0?-1:1;
const z=-4-Math.random()*55;
tree(side*(14+Math.random()*13),z,.7+Math.random()*.8);
}

// Vegetação baixa
for(let i=0;i<45;i++){
const x=(Math.random()-.5)*35;
const z=-Math.random()*60;
if(Math.abs(x)<11)continue;
const bush=new THREE.Mesh(
new THREE.SphereGeometry(.5+Math.random()*.5,6,5),
materials.green);
bush.scale.y=.65;
bush.position.set(x,.35,z);
scene.add(bush);
}

// Obstáculos
for(let i=0;i<8;i++){
box((i%2===0?-1:1)*(4+Math.random()*3),.55,-12-i*4,1.3,1.1,1.3,materials.wood);
}

// Alvos
const targets=[];
function createTarget(x,z){
const group=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(.65,1.1,.22),materials.red);
body.position.y=1.2;
group.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.23,12,10),materials.skin);
head.position.y=1.95;
group.add(head);
group.position.set(x,0,z);
scene.add(group);
targets.push({group,hp:100});
}
createTarget(-5,-17);
createTarget(0,-20);
createTarget(5,-17);
createTarget(-11,-29);
createTarget(11,-29);

// Arma simples em primeira pessoa
const weapon=new THREE.Group();
const metal=new THREE.MeshStandardMaterial({color:0x252a29,metalness:.7,roughness:.35});
const grip=new THREE.MeshStandardMaterial({color:0x343a30,roughness:.9});
function weaponPart(x,y,z,sx,sy,sz,mat){
const p=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
p.position.set(x,y,z);
weapon.add(p);
}
weaponPart(0,0,0,.16,.17,.65,grip);
weaponPart(0,.12,-.3,.12,.1,.55,metal);
weaponPart(0,.12,-.68,.045,.045,.45,metal);
weaponPart(0,.22,-.22,.08,.09,.15,grip);
weaponPart(.02,-.15,-.02,.12,.2,.12,grip);
weapon.position.set(.34,-.31,-.65);
camera.add(weapon);

// Estado
let hp=100,mag=30,reserve=120,reloading=false;
let yaw=0,pitch=0,aiming=false;
const move={x:0,y:0};
const keys={};
const raycaster=new THREE.Raycaster();
const clock=new THREE.Clock();

function hud(){
document.getElementById('health').textContent='VIDA: '+hp;
document.getElementById('ammunition').textContent=mag+' / '+reserve;
}
hud();

// Teclado
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

// Joystick
const stick=document.getElementById('stick');
const knob=document.getElementById('knob');
let stickId=null;
function moveStick(e){
const r=stick.getBoundingClientRect();
let x=e.clientX-r.left-r.width/2;
let y=e.clientY-r.top-r.height/2;
const max=40,len=Math.hypot(x,y);
if(len>max){x=x/len*max;y=y/len*max;}
move.x=x/max;move.y=y/max;
knob.style.transform=`translate(${x}px,${y}px)`;
}
stick.addEventListener('pointerdown',e=>{
stickId=e.pointerId;stick.setPointerCapture(stickId);moveStick(e);
});
stick.addEventListener('pointermove',e=>{
if(e.pointerId===stickId)moveStick(e);
});
function stopStick(e){
if(e.pointerId!==stickId)return;
stickId=null;move.x=0;move.y=0;
knob.style.transform='translate(0,0)';
}
stick.addEventListener('pointerup',stopStick);
stick.addEventListener('pointercancel',stopStick);

// Câmera
let lookId=null,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{
if(e.clientX<innerWidth*.35)return;
lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;
renderer.domElement.setPointerCapture(lookId);
});
renderer.domElement.addEventListener('pointermove',e=>{
if(e.pointerId!==lookId)return;
yaw-=(e.clientX-lastX)*.004;
pitch-=(e.clientY-lastY)*.004;
pitch=Math.max(-1.2,Math.min(1.2,pitch));
lastX=e.clientX;lastY=e.clientY;
});
renderer.domElement.addEventListener('pointerup',e=>{
if(e.pointerId===lookId)lookId=null;
});

// Disparo
function shoot(){
if(mag<=0||reloading)return;
mag--;hud();
raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
const objects=targets.flatMap(t=>t.group.children);
const hits=raycaster.intersectObjects(objects,false);
if(hits.length){
const target=targets.find(t=>t.group===hits[0].object.parent);
if(target){
target.hp-=hits[0].object.position.y>1.5?60:30;
if(target.hp<=0){
scene.remove(target.group);
targets.splice(targets.indexOf(target),1);
}
}
}
weapon.position.z+=.06;
setTimeout(()=>weapon.position.z=-.65,70);
}
document.getElementById('fire').addEventListener('pointerdown',e=>{
e.preventDefault();shoot();
});

// Mira
document.getElementById('aim').onclick=()=>{
aiming=!aiming;
camera.fov=aiming?48:75;
camera.updateProjectionMatrix();
document.getElementById('aim').style.background=aiming?'#718c55':'#344b39';
};

// Recarga
function reload(){
if(reloading||mag===30||reserve<=0)return;
reloading=true;
document.getElementById('reload').textContent='...';
setTimeout(()=>{
const amount=Math.min(30-mag,reserve);
mag+=amount;reserve-=amount;
reloading=false;
document.getElementById('reload').textContent='RECARREGAR';
hud();
},1500);
}
document.getElementById('reload').onclick=reload;
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')reload();});

// Kit médico
document.getElementById('heal').onclick=()=>{
if(hp>=100)return;
hp=Math.min(100,hp+25);
hud();
};

// Iniciar
document.getElementById('begin').onclick=async()=>{
document.getElementById('start').style.display='none';
try{
if(document.documentElement.requestFullscreen)
await document.documentElement.requestFullscreen();
if(screen.orientation?.lock)
await screen.orientation.lock('landscape');
}catch(e){
console.log('Gire o celular para jogar.');
}
};

// Loop
function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.04);
camera.rotation.order='YXZ';
camera.rotation.y=yaw;
camera.rotation.x=pitch;

let forward=move.y,side=move.x;
if(keys.w)forward=-1;
if(keys.s)forward=1;
if(keys.a)side=-1;
if(keys.d)side=1;

const direction=new THREE.Vector3();
camera.getWorldDirection(direction);
direction.y=0;direction.normalize();
const right=new THREE.Vector3().crossVectors(direction,new THREE.Vector3(0,1,0)).normalize();

const speed=5;
camera.position.addScaledVector(direction,-forward*speed*dt);
camera.position.addScaledVector(right,side*speed*dt);
camera.position.y=1.7;

renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
